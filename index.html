<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #d4dff8;
      direction:        rtl;
      display:          flex;
      flex-direction:   column;
      font-family:      'Vazirmatn', 'Tahoma', 'Arial', 'Segoe UI', sans-serif;
      height:           100%;
      margin:           0px;
      text-align:       right;
    }
    html {
      height: 100%;
    }
    main {
      flex:           1;
      margin-left:    10%;
      margin-right:   10%;
      margin-top:     50px;
    }
  </style>
</head>

<body>
  <div style="
        background-color: #c05840;
        text-align:       center;
      ">
    <div style="height: 1em;"></div>
    <div style="font-size: 2em;">
      <strong>
        اتاق ۱۰۵
      </strong>
    </div>
    <div>
      دانشگاه صنعتی شریف، دانشکده علوم ریاضی
    </div>
    <div style="height: 1em;"></div>
  </div>
  

  <main>
    <p>
      سلام! به ما پول بدهید!
    </p>
  </main>


  <footer style="
        background-color: #284c9c;
        color:            #ffffff;
        margin-top: auto;
        text-align: center;
      ">
    <div style="height: 1em;"></div>
    <div style="font-size: 1em;">
      این وبسایت متعلق به دانشجویان فعلی اتاق ۱۰۵ است.
      تمامی محتوای این وبسایت شخصی‌ست
      و نشان‌دهنده دیدگاه‌ها، سیاست‌ها یا مواضع رسمی
      دانشگاه صنعتی شریف یا وابستگان آن نمی‌باشد.
    </div>
    <div style="height: 1em;"></div>
  </footer>
</body>
</html>
